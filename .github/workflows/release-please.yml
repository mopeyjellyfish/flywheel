name: Release Flywheel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install host CLIs
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex

      - name: Validate plugin formatting
        run: node scripts/plugin-ci-check.js --host all

      - name: Validate Claude plugin
        run: |
          claude plugin validate .
          claude plugin tag --dry-run --force .

      - name: Validate Codex plugin
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          CODEX_HOME="$tmpdir" codex plugin marketplace add "$PWD"
          CODEX_HOME="$tmpdir" codex plugin list --marketplace flywheel
          CODEX_HOME="$tmpdir" codex plugin add fw@flywheel

      - name: Create or finalize release
        id: release
        uses: googleapis/release-please-action@v4.4.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
